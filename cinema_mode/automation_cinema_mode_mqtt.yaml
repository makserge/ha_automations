# Paste into Settings > Automations & Scenes > Automations > Create automation > Edit in YAML.
# Topic ha_automations/cinema_mode (publish without the retain flag):
#   1 -> all lights off, ambient 30%, box on (projector + Netflix follow)
#   0 -> all lights off, ambient off, projector off, box off
alias: Cinema mode (MQTT)
mode: restart
triggers:
  - trigger: mqtt
    topic: ha_automations/cinema_mode
    payload: "1"
    id: cinema_on
  - trigger: mqtt
    topic: ha_automations/cinema_mode
    payload: "0"
    id: cinema_off
actions:
  - action: homeassistant.turn_off
    target:
      entity_id:
        - switch.hall_ceiling_light
        - switch.wall_bra
        - light.ledstriphalldimmer_1
  - choose:
      - conditions:
          - condition: trigger
            id: cinema_on
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.ledstriphalldimmer_1
            data:
              brightness_pct: 30
          - if:
              - condition: state
                entity_id: media_player.magentatv_one_2_generation
                state: "off"
            then:
              - action: media_player.turn_on
                target:
                  entity_id: media_player.magentatv_one_2_generation
            else:
              - action: script.turn_on
                target:
                  entity_id: script.projector_hdmi_on
      - conditions:
          - condition: trigger
            id: cinema_off
        sequence:
          - action: script.turn_on
            target:
              entity_id: script.projector_off
          - action: media_player.turn_off
            target:
              entity_id: media_player.magentatv_one_2_generation
