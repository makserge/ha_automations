# Paste into Settings > Automations & Scenes > Automations > Create automation > Edit in YAML.
# Box wakes -> projector on, HDMI-1, Netflix, last-watched title.
# Box in standby for 2 minutes -> projector off.
# Box: 192.168.8.158. Requires "Stromsparmodus" unticked on the box.
alias: Projector follows MagentaTV One
mode: restart
triggers:
  - trigger: state
    entity_id: media_player.magentatv_one_2_generation
    from: "off"
    not_to:
      - "unavailable"
      - "unknown"
    id: wake
  - trigger: state
    entity_id: media_player.magentatv_one_2_generation
    to: "off"
    not_from:
      - "unavailable"
      - "unknown"
    for: "00:02:00"
    id: sleep
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: wake
        sequence:
          - action: script.turn_on
            target:
              entity_id: script.projector_hdmi_on
          - delay: "00:00:05"
          - action: remote.turn_on
            target:
              entity_id: remote.magentatv_one_2_generation
            data:
              activity: "netflix://"
          - delay: "00:00:08"
          - action: remote.send_command
            target:
              entity_id: remote.magentatv_one_2_generation
            data:
              command: DPAD_CENTER
          - delay: "00:00:08"
          - action: remote.send_command
            target:
              entity_id: remote.magentatv_one_2_generation
            data:
              command:
                - DPAD_DOWN
                - DPAD_DOWN
                - DPAD_CENTER
              delay_secs: 1
          - delay: "00:00:03"
          - action: remote.send_command
            target:
              entity_id: remote.magentatv_one_2_generation
            data:
              command: DPAD_CENTER
      - conditions:
          - condition: trigger
            id: sleep
        sequence:
          - action: script.turn_on
            target:
              entity_id: script.projector_off
